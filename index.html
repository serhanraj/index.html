<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunger Points | Snacks &amp; PS5 Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--card:#FFFFFF;--ink:#1B1230;--mut:#5B5370;--line:#E6DCC8;--pin:#D63A1A;--acc:#FFC93C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1230;--card:#271A42;--ink:#FFF4E0;--mut:#B9AFD0;--line:#3A2C5C}}
:root[data-theme="dark"]{--bg:#1B1230;--card:#271A42;--ink:#FFF4E0;--mut:#B9AFD0;--line:#3A2C5C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 'Space Grotesk',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Lilita One','Arial Black',sans-serif;font-weight:400;margin:0;letter-spacing:.5px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-weight:700}
button.p{background:var(--pin);border-color:var(--pin);color:#fff}
button.y{background:var(--acc);border-color:var(--acc);color:#1B1230}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
label{display:block;font-weight:700;margin:12px 0 6px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 16px}
.brand{font-family:'Lilita One',sans-serif;font-size:26px;display:flex;align-items:center;gap:8px}
.brand span,.big span{color:var(--pin)}
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:24px;margin-bottom:16px}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1}
.hero h1 span{color:var(--acc);text-shadow:3px 3px 0 var(--pin)}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;background:var(--acc);color:#1B1230}
.chip.r{background:var(--pin);color:#fff}
.mk{border:2px dashed var(--pin);border-radius:18px;padding:14px 16px;margin:16px 0}
.pi{font-size:40px;line-height:1}
.price{font-family:'Lilita One',sans-serif;font-size:22px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:44px;padding:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.ov{position:fixed;inset:0;background:rgba(10,5,25,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.ov .card{width:100%;max-width:440px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:100%;max-width:400px;text-align:center}
.big{font-size:52px;line-height:1;margin:6px 0}
.tabs{display:flex;gap:8px;margin:18px 0 6px}
.tabs button{flex:1}
.err{color:var(--pin);font-weight:700;min-height:22px;margin:8px 0 0}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.st b{display:block;font-family:'Lilita One',sans-serif;font-size:34px;line-height:1.1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:#1B1230;padding:12px 20px;border-radius:14px;font-weight:700;z-index:20;box-shadow:0 6px 0 var(--pin)}
.se{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;margin-bottom:8px}
.se input{padding:0 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
// ====== SETTINGS ======
const OWNER_PASS = 'hunger2026'; // change this! (front-end only, see notes)
const K = 'hp_state_v1', SK = 'hp_session_v1';
// ====== HELPERS ======
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mi = 0;
const logo = w => { const id = 'm' + (++mi); return ⁠ <svg width="${w}" height="${w*1.22}" viewBox="0 0 128 156" role="img" aria-label="Hunger Points logo"><defs><mask id="${id}"><rect width="128" height="156" fill="#fff"/><circle cx="103" cy="21" r="17" fill="#000"/></mask></defs><g mask="url(#${id})"><path transform="translate(7 8)" d="M60 146C60 146 8 92 8 58A52 52 0 0 1 112 58C112 92 60 146 60 146Z" fill="#FFC93C"/><path d="M60 146C60 146 8 92 8 58A52 52 0 0 1 112 58C112 92 60 146 60 146Z" fill="#D63A1A"/></g><rect x="40" y="44" width="12" height="36" rx="3" fill="#FFF4E0"/><rect x="28" y="56" width="36" height="12" rx="3" fill="#FFF4E0"/><circle cx="78" cy="72" r="7.5" fill="#FFC93C"/><circle cx="91" cy="56" r="7.5" fill="#FFF4E0"/></svg> ⁠; };
// ====== DATA ======
// NOTE: placeholder products & prices. Edit this list to match your real menu.
// n = name, pr = price, st = stock, i = emoji, c = 's' (snacks) or 'c' (combos & games), g = small label
const DEF = () => ({visits:0, seq:1000, ps5:'free', orders:[], p:[
 {id:1,c:'s',g:'Namkeen',n:'Roasted Makhana',pr:20,st:30,i:'🍿'},
 {id:2,c:'s',g:'Namkeen',n:'Mixed Namkeen',pr:15,st:40,i:'🥜'},
 {id:3,c:'s',g:'Namkeen',n:'Bhel Mix',pr:20,st:25,i:'🥣'},
 {id:4,c:'s',g:'Sweet',n:'Chocolate Brownie',pr:30,st:20,i:'🍫'},
 {id:5,c:'s',g:'Sweet',n:'Gulab Jamun Cup',pr:25,st:20,i:'🍮'},
 {id:6,c:'s',g:'Sweet',n:'Peanut Chikki',pr:10,st:50,i:'🥠'},
 {id:7,c:'s',g:'Chips',n:'Classic Salted Chips',pr:10,st:60,i:'🥔'},
 {id:8,c:'s',g:'Chips',n:'Masala Munch',pr:10,st:60,i:'🌶️'},
 {id:9,c:'s',g:'Chips',n:'Cheesy Nachos',pr:20,st:30,i:'🧀'},
 {id:10,c:'c',g:'Combo',n:'Snack Combo (chips + drink)',pr:40,st:25,i:'🥤'},
 {id:11,c:'c',g:'PS5',n:'Mortal Kombat: 1 Match',pr:20,st:99,i:'🎮'},
 {id:12,c:'c',g:'Combo',n:'Game + Snack Combo',pr:50,st:25,i:'🕹️'}
]});
let S, mem = null, ses = null, cart = {}, tab = 's', lt = 'c', seen = 0;
function load(){ try{ const r = localStorage.getItem(K); S = r ? JSON.parse(r) : (mem || DEF()); }catch(e){ S = mem || DEF(); } }
function save(){ mem = S; try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){} }
function getSes(){ try{ return JSON.parse(sessionStorage.getItem(SK)); }catch(e){ return null; } }
function setSes(v){ ses = v; try{ v ? sessionStorage.setItem(SK, JSON.stringify(v)) : sessionStorage.removeItem(SK); }catch(e){} }
const live = () => S.orders.filter(o => o.s !== 'Cancelled');
// ====== VIEWS ======
function render(){
  $('#modal').innerHTML = '';
  if(!ses) return login();
  ses.role === 'o' ? owner() : shop();
}
function login(){
  $('#app').innerHTML = `<main class="login"><div class="lc">${logo(110)}<div class="big">HUNGER <span>POINT</span></div><p class="mut" style="margin:0">Snacks &amp; PS5 Gaming &middot; Stall at FOIR</p>
  <div class="tabs"><button data-a="lt" data-v="c" class="${lt=='c'?'on':''}">Customer</button><button data-a="lt" data-v="o" class="${lt=='o'?'on':''}">Owner</button></div>
  <form id="lf" class="card" style="text-align:left">${lt=='c'
   ? ⁠ <label for="nm">Your name</label><input id="nm" autocomplete="name" required maxlength="30" placeholder="e.g. Aarav"><p class="err" id="er"></p><button class="p" style="width:100%">Enter the stall</button> ⁠
   : ⁠ <label for="pw">Owner password</label><input id="pw" type="password" autocomplete="current-password" required><p class="err" id="er"></p><button class="y" style="width:100%">Owner login</button> ⁠}</form></div></main>`;
}
function shop(){
  const items = S.p.filter(p => p.c === tab);
  const n = Object.values(cart).reduce((a,b)=>a+b,0), tot = S.p.reduce((a,p)=>a+(cart[p.id]||0)*p.pr,0);
  $('#app').innerHTML = `<div class="wrap"><div class="top"><div class="brand">${logo(30)}<div>HUNGER<span>POINTS</span></div></div><div class="row"><span class="mut">Hi, ${esc(ses.name)}</span><button data-a="th" aria-label="Toggle light or dark">Theme</button><button data-a="out">Log out</button></div></div>
  <section class="hero"><span class="chip">Stall location: FOIR</span><h1 style="margin-top:12px">Hunger Points<br><span>Games &amp; Snacks</span></h1><p style="margin:10px 0 0;max-width:520px">Healthy namkeen, sweet treats, crunchy chips and PS5 Mortal Kombat. Order here, pick up at our stall.</p></section>
  <div class="row sp"><span class="chip ${S.ps5=='free'?'':'r'}">${S.ps5=='free'?'PS5 available now &middot; No queue':'PS5 busy right now'}</span><span class="mut">Pick up from our stall &middot; Pay cash at the stall</span></div>
  <div class="mk"><h3 style="font-size:22px">Mortal Kombat challenge: win &#8377;150 cashback!</h3><p style="margin:4px 0 0">Beat our stall champ or get a 3-match win streak to claim &#8377;150 instant cashback or stall credit.</p></div>
  <div class="tabs" style="margin-top:0"><button data-a="tab" data-v="s" class="${tab=='s'?'on':''}">Snacks &amp; Treats</button><button data-a="tab" data-v="c" class="${tab=='c'?'on':''}">Combos &amp; Games</button></div>
  <div class="grid" style="margin-top:12px">${items.map(p=>`<div class="card"><div class="pi" aria-hidden="true">${p.i}</div><span class="chip" style="margin-top:8px">${esc(p.g)}</span><h3 style="font-size:20px;margin:6px 0">${esc(p.n)}</h3><div class="row sp"><span class="price">&#8377;${p.pr}</span><span class="mut">${p.st>0?(p.st>50?'Available':p.st+' left'):'Sold out'}</span></div>
  <div class="qty" style="margin-top:10px">${p.st>0?⁠ <button data-a="sub" data-v="${p.id}" aria-label="Remove one ${esc(p.n)}">&minus;</button><b aria-live="polite">${cart[p.id]||0}</b><button class="y" data-a="add" data-v="${p.id}" aria-label="Add one ${esc(p.n)}">+</button> ⁠:'<button disabled>Sold out</button>'}</div></div>`).join('')}</div>
  <p class="mut" style="text-align:center;margin-top:28px">Hunger Points Stall &middot; Managed by 7th grade students of Lovedale School &middot; Crafted by Serhan Raj</p>
  <section class="card" style="margin-top:16px"><h3 style="font-size:22px;margin-bottom:8px">Meet our stall team</h3><div class="row">${['Serhan','Vivaan','Abeer','Darsh','Hiren'].map(x=>⁠ <span class="chip">${x} &middot; 7th Lovedale</span> ⁠).join('')}</div></section></div>
  ${n?⁠ <div class="bar"><b>Total: &#8377;${tot} (${n} item${n>1?'s':''})</b><button class="y" data-a="co">Checkout</button></div> ⁠:''}`;
}
function checkout(){
  const lines = S.p.filter(p=>cart[p.id]).map(p=>⁠ <div class="row sp"><span>${cart[p.id]} &times; ${esc(p.n)}</span><b>&#8377;${cart[p.id]*p.pr}</b></div> ⁠).join('');
  const tot = S.p.reduce((a,p)=>a+(cart[p.id]||0)*p.pr,0);
  $('#modal').innerHTML = `<div class="ov"><form class="card" id="cf"><h3 style="font-size:24px">Pick-up order</h3>${lines}<div class="row sp" style="border-top:2px solid var(--line);margin-top:8px;padding-top:8px"><b>Total</b><b class="price">&#8377;${tot}</b></div>
  <label for="cn">Your name</label><input id="cn" required maxlength="30" value="${esc(ses.name)}">
  <label for="cp">How you pay</label><input id="cp" value="Cash at stall (pick up at FOIR)" disabled>
  <label for="cg">Favourite Mortal Kombat fighter (optional)</label><select id="cg"><option>No preference</option><option>Scorpion</option><option>Sub-Zero</option><option>Raiden</option><option>Liu Kang</option></select>
  <div class="row" style="margin-top:16px"><button type="button" data-a="close">Back</button><button class="p" style="flex:1">Place order</button></div></form></div>`;
}
function owner(){
  $('#app').innerHTML = `<div class="wrap"><div class="top"><div class="brand">${logo(30)}<div>OWNER<span>CENTER</span></div></div><div class="row"><button data-a="th">Theme</button><button data-a="out">Exit owner mode</button></div></div>
  <div id="ost"></div>
  <section class="card" style="margin-bottom:16px"><h3 style="font-size:22px;margin-bottom:10px">PS5 status</h3><div class="row"><button data-a="ps" data-v="free" id="b1">Available now</button><button data-a="ps" data-v="busy" id="b2">Occupied / busy</button></div></section>
  <section class="card" style="margin-bottom:16px"><div class="row sp"><h3 style="font-size:22px">Live orders</h3><div class="row"><button class="y" data-a="sim">Simulate a customer order</button><button data-a="reset">Reset all</button></div></div><div class="tw" id="oor" style="margin-top:8px"></div></section>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><section class="card"><h3 style="font-size:22px;margin-bottom:10px">Prices &amp; stock</h3><div class="se mut"><span>Item</span><span>Price &#8377;</span><span>Stock</span></div><div id="ose"></div></section>
  <form class="card" id="mf"><h3 style="font-size:22px;margin-bottom:6px">Add offline order</h3><label for="mn">Customer name</label><input id="mn" required maxlength="30"><label for="mi">Item</label><select id="mi">${S.p.map(p=>⁠ <option value="${p.id}">${esc(p.n)}</option> ⁠).join('')}</select><label for="mq">Quantity</label><input id="mq" type="number" min="1" max="20" value="1"><button class="p" style="width:100%;margin-top:14px">Add record</button></form></div></div>`;
  ownerLive(true);
}
function ownerLive(stock){
  if(!$('#ost')) return;
  const L = live(), rev = L.reduce((a,o)=>a+o.t,0);
  $('#ost').innerHTML = ⁠ <div class="st"><div class="card"><span class="mut">Total visits</span><b>${S.visits}</b></div><div class="card"><span class="mut">Orders placed</span><b>${L.length}</b></div><div class="card"><span class="mut">Visited &amp; left</span><b>${Math.max(0,S.visits-L.filter(o=>o.src!='manual').length)}</b></div><div class="card"><span class="mut">Earned (cash)</span><b>&#8377;${rev}</b></div></div> ⁠;
  $('#b1').className = S.ps5=='free'?'y':''; $('#b2').className = S.ps5=='busy'?'p':'';
  const nx = {New:'Preparing',Preparing:'Ready',Ready:'Picked up'};
  $('#oor').innerHTML = S.orders.length ? ⁠ <table><thead><tr><th>Token</th><th>Time</th><th>Name</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${S.orders.map(o=> ⁠<tr><td><b>#${o.k}</b></td><td>${esc(o.tm)}</td><td>${esc(o.n)}${o.f&&o.f!='No preference'?⁠ <br><span class="mut">${esc(o.f)}</span> ⁠:''}</td><td>${o.it.map(i=>i.q+'&times; '+esc(i.n)).join(', ')}</td><td>&#8377;${o.t}</td><td><span class="chip ${o.s=='Cancelled'?'r':''}">${o.s}</span></td><td>${nx[o.s]?⁠ <button data-a="ns" data-v="${o.k}">Mark ${nx[o.s]}</button> <button data-a="cx" data-v="${o.k}">Cancel</button> ⁠:''}</td></tr>⁠ ).join('')}</tbody></table> ⁠ : '<p class="mut">No orders yet. They appear here the moment someone buys.</p>';
  const ed = $('#ose');
  if(ed && (stock || !ed.contains(document.activeElement))) ed.innerHTML = S.p.map(p=>⁠ <div class="se"><span>${p.i} ${esc(p.n)}</span><input type="number" min="0" value="${p.pr}" data-f="pr" data-id="${p.id}" aria-label="Price of ${esc(p.n)}"><input type="number" min="0" value="${p.st}" data-f="st" data-id="${p.id}" aria-label="Stock of ${esc(p.n)}"></div> ⁠).join('');
}
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = m; document.body.appendChild(t); setTimeout(()=>t.remove(), 3500); }
// ====== ORDERS ======
function addOrder(name, lines, fighter, src){
  const it = [];
  for(const [id,q] of lines){ const p = S.p.find(x=>x.id==id); if(!p||q<1) continue; if(p.st<q) return null; it.push({id:p.id,n:p.n,q,pr:p.pr}); }
  if(!it.length) return null;
  it.forEach(i => { S.p.find(x=>x.id==i.id).st -= i.q; });
  const o = {k:++S.seq, tm:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), n:name, it, t:it.reduce((a,i)=>a+i.q*i.pr,0), s:'New', f:fighter||'', src};
  S.orders.unshift(o); save(); return o;
}
// ====== EVENTS ======
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if(a=='lt'){ lt = v; login(); }
  else if(a=='th'){ const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme=='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; }
  else if(a=='out'){ setSes(null); cart = {}; render(); }
  else if(a=='tab'){ tab = v; shop(); }
  else if(a=='add'){ const p = S.p.find(x=>x.id==v); if((cart[v]||0) < p.st){ cart[v] = (cart[v]||0)+1; shop(); } }
  else if(a=='sub'){ if(cart[v]>1) cart[v]--; else delete cart[v]; shop(); }
  else if(a=='co') checkout();
  else if(a=='close') $('#modal').innerHTML = '';
  else if(a=='ok'){ cart = {}; render(); }
  else if(a=='ps'){ S.ps5 = v; save(); ownerLive(); }
  else if(a=='ns'){ const o = S.orders.find(x=>x.k==v); o.s = {New:'Preparing',Preparing:'Ready',Ready:'Picked up'}[o.s]; save(); ownerLive(); }
  else if(a=='cx'){ const o = S.orders.find(x=>x.k==v); o.s = 'Cancelled'; o.it.forEach(i => { const p = S.p.find(x=>x.id==i.id); if(p) p.st += i.q; }); save(); ownerLive(true); }
  else if(a=='reset'){ if(confirm('Clear all orders and visitor stats?')){ const p = S.p; S = DEF(); S.p = p; save(); owner(); } }
  else if(a=='sim'){
    const names = ['Aarav','Mira','Kabir','Anaya','Rohan','Diya','Veer','Ira'], pool = S.p.filter(p=>p.st>0);
    if(!pool.length) return;
    const n = 1 + Math.floor(Math.random()*3), lines = [];
    for(let i=0;i<n;i++){ const p = pool[Math.floor(Math.random()*pool.length)]; lines.push([p.id, 1]); }
    const o = addOrder(names[Math.floor(Math.random()*names.length)], lines, '', 'demo');
    if(o){ S.visits++; save(); seen = S.orders.length; toast('New order #'+o.k+' from '+o.n); ownerLive(true); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id=='lf'){
    if(lt=='c'){ const n = $('#nm').value.trim(); if(!n) return; load(); S.visits++; save(); setSes({role:'c',name:n}); render(); }
    else if($('#pw').value === OWNER_PASS){ setSes({role:'o',name:'Owner'}); load(); seen = S.orders.length; render(); }
    else $('#er').textContent = 'Wrong password. Try again.';
  }
  else if(e.target.id=='cf'){
    load();
    const o = addOrder($('#cn').value.trim() || ses.name, Object.entries(cart).map(([id,q])=>[+id,q]), $('#cg').value, 'online');
    if(!o){ $('#modal').innerHTML = ''; toast('Sorry, some items just sold out. Please check your cart.'); cart = {}; shop(); return; }
    $('#modal').innerHTML = ⁠ <div class="ov"><div class="card" style="text-align:center"><h3 style="font-size:26px">Order placed!</h3><p class="mut">Your token number</p><div class="big" style="color:var(--pin)">#${o.k}</div><p>Pick up from our stall at <b>FOIR</b> in 5&ndash;10 mins and pay cash there.</p><button class="y" data-a="ok" style="width:100%">Awesome, got it!</button></div></div> ⁠;
  }
  else if(e.target.id=='mf'){
    load(); const o = addOrder($('#mn').value.trim(), [[+$('#mi').value, +$('#mq').value]], '', 'manual');
    if(o){ toast('Offline order #'+o.k+' added'); owner(); } else toast('Not enough stock for that item.');
  }
});
document.addEventListener('change', e => {
  const f = e.target.dataset.f; if(!f) return;
  const p = S.p.find(x=>x.id==e.target.dataset.id); p[f] = Math.max(0, +e.target.value || 0); save();
});
// ====== LIVE SYNC (owner panel updates by itself when someone buys) ======
function sync(){
  if(!ses) return; const n = S.orders.length;
  if(ses.role=='o'){ if(n > seen){ const o = S.orders[0]; if(o.src!='manual' && o.src!='demo') toast('New order #'+o.k+' from '+o.n); } seen = n; ownerLive(); }
  else if(!$('#modal').innerHTML) shop();
}
addEventListener('storage', e => { if(e.key==K){ load(); sync(); } });
let lastRaw = null;
setInterval(() => { let r = null; try{ r = localStorage.getItem(K); }catch(e){} if(r !== lastRaw){ lastRaw = r; load(); sync(); } }, 2000);
load(); ses = getSes(); if(ses && ses.role=='o') seen = S.orders.length; render();
</script>
</body>
</html>
