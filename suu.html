<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 25px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: rgba(0, 0, 0, 0.18);
      padding: 15px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-title {
      font-size: 13px;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .text-box {
      background: white;
      color: #222;
      padding: 25px;
      border-radius: 18px;
      font-size: 20px;
      line-height: 1.7;
      min-height: 130px;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      height: 160px;
      resize: vertical;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 18px;
      padding: 20px;
      font-size: 18px;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: white;
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.75);
    }

    textarea:focus {
      border-color: white;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button,
    select {
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button {
      background: white;
      color: #5c55c7;
    }

    button:hover {
      transform: translateY(-2px);
    }

    select {
      background: white;
      color: #222;
    }

    .result {
      display: none;
      text-align: center;
      background: rgba(0,0,0,0.18);
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
    }

    .result h2 {
      margin-top: 0;
    }

    .tip {
      text-align: center;
      margin-top: 16px;
      opacity: 0.8;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 {
        font-size: 32px;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ Typing Speed Challenge</h1>
    <div class="subtitle">
      Type as fast and accurately as you can!
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-title">TIME</div>
        <div class="stat-value" id="time">60</div>
      </div>

      <div class="stat">
        <div class="stat-title">WPM</div>
        <div class="stat-value" id="wpm">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">ACCURACY</div>
        <div class="stat-value" id="accuracy">100%</div>
      </div>

      <div class="stat">
        <div class="stat-title">ERRORS</div>
        <div class="stat-value" id="errors">0</div>
      </div>
    </div>

    <div class="text-box" id="textBox"></div>

    <textarea
      id="typingInput"
      placeholder="Click Start and begin typing..."
      disabled
      spellcheck="false">
    </textarea>

    <div class="controls">

      <select id="duration">
        <option value="15">15 Seconds</option>
        <option value="30">30 Seconds</option>
        <option value="60" selected>60 Seconds</option>
      </select>

      <button id="startBtn">▶ Start</button>

      <button id="resetBtn">↻ Reset</button>

    </div>

    <div class="result" id="result">
      <h2>🎉 Test Complete!</h2>
      <p id="resultText"></p>
    </div>

    <div class="tip">
      💡 Tip: Accuracy is just as important as speed!
    </div>

  </div>

  <script>

    const sentences = [
      "Learning new things becomes easier when you practice a little every day.",
      "The quick brown fox jumps over the lazy dog near the river.",
      "Technology can make learning more creative interactive and fun.",
      "Great typing speed comes from regular practice patience and accuracy.",
      "Every mistake is an opportunity to learn something new and improve.",
      "Believe in yourself and keep practicing because progress takes time.",
      "The internet gives us many amazing tools for learning and creating.",
      "Good typists focus on both speed and accuracy while staying relaxed."
    ];

    const textBox = document.getElementById("textBox");
    const typingInput = document.getElementById("typingInput");
    const timeDisplay = document.getElementById("time");
    const wpmDisplay = document.getElementById("wpm");
    const accuracyDisplay = document.getElementById("accuracy");
    const errorsDisplay = document.getElementById("errors");

    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const durationSelect = document.getElementById("duration");

    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");

    let currentSentence = "";
    let timeLeft = 60;
    let timer = null;
    let testRunning = false;
    let startTime = null;

    function chooseSentence() {
      const randomIndex = Math.floor(Math.random() * sentences.length);
      currentSentence = sentences[randomIndex];
      textBox.textContent = currentSentence;
    }

    function resetStats() {
      timeLeft = Number(durationSelect.value);

      timeDisplay.textContent = timeLeft;
      wpmDisplay.textContent = "0";
      accuracyDisplay.textContent = "100%";
      errorsDisplay.textContent = "0";
    }

    function calculateStats() {

      const typedText = typingInput.value;

      let correctCharacters = 0;
      let errors = 0;

      for (let i = 0; i < typedText.length; i++) {

        if (typedText[i] === currentSentence[i]) {
          correctCharacters++;
        } else {
          errors++;
        }

      }

      const totalTyped = typedText.length;

      let accuracy = 100;

      if (totalTyped > 0) {
        accuracy = Math.round(
          (correctCharacters / totalTyped) * 100
        );
      }

      let elapsedMinutes = 1 / 60;

      if (startTime) {
        elapsedMinutes =
          Math.max(
            (Date.now() - startTime) / 60000,
            1 / 60
          );
      }

      const wpm = Math.max(
        0,
        Math.round(
          (correctCharacters / 5) / elapsedMinutes
        )
      );

      wpmDisplay.textContent = wpm;
      accuracyDisplay.textContent = accuracy + "%";
      errorsDisplay.textContent = errors;
    }

    function startTest() {

      if (testRunning) return;

      testRunning = true;

      typingInput.disabled = false;
      typingInput.value = "";
      typingInput.focus();

      result.style.display = "none";

      timeLeft = Number(durationSelect.value);
      timeDisplay.textContent = timeLeft;

      startTime = Date.now();

      startBtn.disabled = true;
      durationSelect.disabled = true;

      timer = setInterval(() => {

        timeLeft--;

        timeDisplay.textContent = timeLeft;

        calculateStats();

        if (timeLeft <= 0) {
          finishTest();
        }

      }, 1000);
    }

    function finishTest() {

      clearInterval(timer);

      timer = null;
      testRunning = false;

      typingInput.disabled = true;

      startBtn.disabled = false;
      durationSelect.disabled = false;

      calculateStats();

      const wpm = Number(wpmDisplay.textContent);
      const accuracy =
        accuracyDisplay.textContent;

      result.style.display = "block";

      let message = "";

      if (wpm >= 60 && parseInt(accuracy) >= 95) {
        message = "🔥 AMAZING! You are a typing master!";
      }
      else if (wpm >= 40 && parseInt(accuracy) >= 90) {
        message = "🚀 Great job! Your typing is really good!";
      }
      else if (wpm >= 25) {
        message = "👏 Nice work! Keep practicing!";
      }
      else {
        message = "💪 Good try! Practice and you will get faster!";
      }

      resultText.innerHTML =
        `You typed at <strong>${wpm} WPM</strong> with <strong>${accuracy}</strong> accuracy.<br><br>${message}`;
    }

    function resetTest() {

      clearInterval(timer);

      timer = null;
      testRunning = false;
      startTime = null;

      typingInput.disabled = true;
      typingInput.value = "";

      startBtn.disabled = false;
      durationSelect.disabled = false;

      result.style.display = "none";

      chooseSentence();
      resetStats();
    }

    typingInput.addEventListener("input", () => {

      if (!testRunning) return;

      calculateStats();

      if (
        typingInput.value.length >=
        currentSentence.length
      ) {
        finishTest();
      }

    });

    startBtn.addEventListener("click", startTest);

    resetBtn.addEventListener("click", resetTest);

    durationSelect.addEventListener("change", () => {

      if (!testRunning) {
        resetStats();
      }

    });

    chooseSentence();
    resetStats();

  </script>

</body>
</html>
